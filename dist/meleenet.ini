; meleenet - network co-op for TMNT Mutant Melee (PC).
; The launcher edits this file; every key can also be changed by hand.

[video]
; borderless: without a frame over the whole monitor; window: an ordinary window;
; game: the game's own exclusive full screen at 640x480 (the mod leaves the screen alone)
mode = borderless
; auto: the monitor's own size (the window's in window mode), or WIDTHxHEIGHT
resolution = auto
; wide: the picture has the monitor's shape, the view is wider at the sides; 4:3: the original picture with bars
aspect = wide
; wide: the menus fill a wide picture; bars: the game's own 4:3 menus with black bars at the sides
menus = wide
window_width = 0
window_height = 0
; smoothed edges: 0, 2, 4, 8
antialiasing = 4
; sharp textures at an angle: 0, 2, 4, 8, 16
anisotropy = 16
; the game's own picture options: outlines of the heroes, live shadows (1 / 0), particles in percent
toon_shading = 1
shadows = 1
particles = 100
; 1: when the PC cannot draw 60 pictures a second, a fight's frames are played without their pictures
; (up to three in a row) and the game keeps its speed - in a network game, everybody's; 0: every frame is drawn
frame_skip = 1

[input]
; the mouse buttons can be bound as keys
mouse = 1

[net]
name = player
port = 47830
delay = 2
transport = auto
lobby = friends

[log]
level = info
